name: Tests

on:
  pull_request:

concurrency:
  group: tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    defaults:
      run:
        working-directory: src

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, zip, bcmath, pdo_sqlite
          coverage: none

      - uses: ramsey/composer-install@v3
        with:
          working-directory: src

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Install Puppeteer
        run: npm ci --no-audit --no-fund
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      # PdfGenerator expects Chromium at /usr/bin/chromium; use the runner's preinstalled Chrome.
      - name: Link Chrome as Chromium
        run: sudo ln -sf "$(command -v google-chrome)" /usr/bin/chromium && /usr/bin/chromium --version

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test

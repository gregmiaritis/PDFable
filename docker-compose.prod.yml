services:
  app:
    build:
      context: .
      dockerfile: docker/production/Dockerfile
      target: app
    image: pdfable-app:prod
    restart: unless-stopped
    env_file: ./src/.env.production
    networks:
      - pdfable

  nginx:
    build:
      context: .
      dockerfile: docker/production/Dockerfile
      target: nginx
    image: pdfable-nginx:prod
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - pdfable

networks:
  pdfable:
    driver: bridge

services:
  app:
    build:
      context: ./docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: pdfable-app
    restart: unless-stopped
    volumes:
      - ./src:/var/www/html
    networks:
      - pdfable

  nginx:
    image: nginx:alpine
    container_name: pdfable-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./src:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - pdfable

networks:
  pdfable:
    driver: bridge
